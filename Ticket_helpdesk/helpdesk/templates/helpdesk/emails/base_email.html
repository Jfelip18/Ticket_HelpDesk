<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Help Desk{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#F6F6F4;font-family:Arial,Helvetica,sans-serif;color:#3C3C3B;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F6F6F4;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #E3E3E1;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="height:6px;background-color:#F07E12;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px 32px;">
              <span style="font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#F07E12;">Help Desk</span>
              <h1 style="margin:12px 0 0 0;font-size:22px;line-height:1.3;color:#3C3C3B;">{% block encabezado %}Notificación{% endblock %}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px 32px;font-size:15px;line-height:1.6;color:#3C3C3B;">
              {% block contenido %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;background-color:#F6F6F4;border-top:1px solid #E3E3E1;font-size:12px;line-height:1.5;color:#575756;">
              Este correo fue generado automáticamente por el Help Desk.<br>
              Por favor no responda a este mensaje.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
