<div class="acciones-linea">
  {% if ticket.puede_atender %}
    <form method="post" action="{% url 'helpdesk:panel_ticket_atender' ticket.pk %}" class="inline" data-cargando>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ destino }}">
      <button class="accion-icono accion-icono-primario" type="submit" title="Tomar ticket">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8.5 11.5V6.2a1.5 1.5 0 0 1 3 0v4.3"></path>
          <path d="M11.5 10.5V9.4a1.5 1.5 0 0 1 3 0v1.6"></path>
          <path d="M14.5 11.4V11a1.5 1.5 0 0 1 3 0v3.6a6.4 6.4 0 0 1-6.4 6.4h-1.2a6 6 0 0 1-4.3-1.8L3.7 15.2a1.5 1.5 0 0 1 2.2-2l2.6 2.4"></path>
        </svg>
      </button>
    </form>
  {% endif %}
  {% if ticket.puede_escalar %}
    <a class="accion-icono" data-cargando title="Subir a otra dependencia"
       href="{% url 'helpdesk:panel_ticket_escalar' ticket.pk %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7"></path>
        <path d="M9 7h8v8"></path>
      </svg>
    </a>
  {% endif %}
  {% if ticket.puede_finalizar %}
    <form method="post" action="{% url 'helpdesk:panel_ticket_finalizar' ticket.pk %}" class="inline" data-cargando>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ destino }}">
      <button class="accion-icono accion-icono-finalizar" type="submit" title="Finalizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m4.5 12.5 5 5 10-11"></path>
        </svg>
      </button>
    </form>
  {% endif %}
</div>
